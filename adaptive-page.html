<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="one">
<h1>Адаптивная страница</h1>
<p>Эта страница адаптируется под разные экраны</p>
    </div>

    <style>
        .one {
            width: 100%;
            height: 300px;
            background-color: peru;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .one h1 {
            font-size: 100px;
        }

        .one p {
            font-size: 32px;
        }
        
        @media (max-width: 600px) {
            .one {
                background-color: blue;
            }

            .one h1 {
                font-size: 32px;
            }

            .one p {
                font-size: 16px;
            }
        }

        @media (max-width: 1485px) {
            .one {
                background-color: green;
            }

            .one h1 {
                font-size: 32px;
            }

            .one p {
                font-size: 16px;
            }
        }
    </style>
</body>
</html>

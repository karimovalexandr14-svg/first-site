<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Page</title>

    <style>
        body {
            color: white;
        }
    </style>
</head>









<body>
    <!-- Увеличение блока -->
    <div class="box-scale"></div>
    <style>
        .box-scale {
            width: 50px;
            height: 50px;
            margin: 50px;
            background-color: orange;
            animation: boxScale 2s ease infinite
                /* подключение созданной анимации */
                /* boxScale – название анимации ‘animation-name’ */
                /* 2s – длительность анимации ‘animation-duration’ */
                /* ease – стиль анимации ‘timing-function’ ease, linear и т.д */
                /* 1s – задержка ‘animation-delay’ перед началом */
                /* infinite – бесконечное повторение, можно писать число например 3 раза */
        }

        /* keyframes – кадры анимации */
        /* boxScale – название анимации (может быть любым) */
        /* 0% – начало анимации, 50% – середина, 100% – конец */
        @keyframes boxScale {
            0% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.5)
            }

            100% {
                transform: scale(1)
            }
        }
    </style>



    <!-- появление блока -->
    <div class="box-fade">
        <h2>Lorem ipsum dolor sit amet</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Veritatis, optio nihil? Possimus veniam illo ex
            error repudiandae nam consectetur eveniet?</p>
    </div>
    <style>
        .box-fade {
            /*  width: 100px;
            height: 100px; */
            padding: 20px;
            background-color: rgb(106, 0, 85);
            animation:
                FadeIn 0.3s forwards,
                /* Не понял почему после конца анимации блок пропадает, а потом снова появляется, спросил у ИИ.
                Он ответил, что нужно добавить свойство forwards */
                FadeOut 0.5s 2s forwards;
        }

        @keyframes FadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes FadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }
    </style>


    <!-- отступление блока вправо и по часовой стрелке -->
    <div class="box-green"></div>
    <style>
        .box-green {
            width: 100px;
            height: 100px;
            background-color: green;
            /* animation: moveRight: 3s; */

            /* если нужно бесконечное повторение по горизонтали */

            animation: moveRight 4s ease-in-out infinite;
            /* alternate - когда анимация заканчивается то идет обратно */
        }

        /* translateX означает двигать по горизонатали */
        @keyframes moveRight {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(200px, 0)
            }

            50% {
                transform: translate(200px, 200px)
            }

            75% {
                transform: translate(0, 200px)
            }

            100% {
                transform: translate(0, 0)
            }

            /*  from {
                transform: translateX(0);
            }

            to {
                transform: translateX(400px);
            } */
        }
    </style>

    <!-- Loader - иконка загрузки -->
    <div class="loader"></div>
    <style>
        .loader {
            width: 50px;
            height: 50px;
            margin: 50px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            border: 3px solid;
            border-color: black transparent;
            box-sizing: border-box;
            animation: MyRotation 1s linear infinite;
        }

        @keyframes MyRotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Пульсирующая кнопка -->
    <div class="help-button">!</div>
    <style>
        .help-button {
            color: black;
            width: 25px;
            height: 25px;
            margin: 50px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: greenyellow;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(10, 42, 2, 0);
            }

            70% {
                transform: scale(2);
                box-shadow: 0 0 0 10px rgba(40, 178, 5, 0.415);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(31, 99, 16, 0);
            }
        }
    </style>


    <div class="gradient"></div>
    <style>
        .gradient {
            width: 100vw;
            height: 300px;
            background: linear-gradient(to right, #dc0606, #ff8400);
            background-size: 200% 200%;
            animation: gradient 8s ease infinite;
        }

        @keyframes gradient {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
    </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <title>Figma Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0b132a;
        }

        header {
            display: flex;
            justify-content: space-between; /* space-between - первый элемент - к левому краю, последний - к правому */
            align-items: center;
            padding: 25px 80px;
        }

        nav {
            display: flex;
            gap: 40px;
        }

        nav a {
            color: #555;
            font-size: 16px;
            text-decoration: none;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .login {
            color: #000;
            font-weight: 600;
            text-decoration: none;
        }

        .signup {
            color: #F53855;
            border-radius: 50px;
            padding: 10px 35px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #F53855;
        }

        /* hero */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between; /* space-between - первый элемент - к левому краю, последний - к правому */
            gap: 40px;
            padding: 40px 80px;
            margin-left: 40px;
        }

        .hero-content {
            max-width: 560px;
        }

        .hero-content .text {
            font-size: 50px;
            font-weight: 700;
            line-height: 1.2;
            color: #0b132a;
            margin-bottom: 20px;
        }

        /* Подзаголовок */
        .hero-sub {
            font-size: 16px;
            color: #4f5665;
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 420px;
        }

        .btn {
            display: inline-block;
            background: #f53855;
            color: #ffffff;
            font-size: 16px;
            padding: 15px 60px;
            border-radius: 10px;
        }

        .hero-image {
            flex: 1 1 45%;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .hero-image img {
            max-width: 100%;
            height: auto;
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>

<body>
    <header>
        <p>🔥Lasles<span>VPN</span></p>

        <nav>
            <a href="#">About</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">Testimonials</a>
            <a href="#">Help</a>
        </nav>

        <div class="buttons">
            <a href="#" class="login">Sign In</a>
            <a href="#" class="signup">Sign Up</a>
        </div>
    </header>

    <main>
        <div class="hero">
            <div class="hero-content">
                <h1 class="text">
                    Want anything to be <br />
                    easy with <h2>Lasles</h2><h1>VPN</h1>.
                </h1>
                <p class="hero-sub">
                    Provide a network for all your needs with ease and fun using
                    <strong>LaslesVPN</strong> discover interesting features from us.
                </p>
                <a href="#" class="btn">Get Started</a>
            </div>

            <div class="hero-image">
                <img src="illustration1.png" />
            </div>
        </div>
    </main>
</body>

</html>
